# Debian Trixie preseed configuration
# Fully automated headless installation for QEMU VM
# Ref: https://www.debian.org/releases/trixie/amd64/apbs04.en.html

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i debconf/priority string critical
d-i debconf/frontend select Noninteractive

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-qemu
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

### Partitioning — guided, entire disk, LVM, no separate /home
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Root account — disable root login, use sudo user instead
d-i passwd/root-login boolean false

### User account
d-i passwd/user-fullname string user
d-i passwd/username string user
# Password: "user" — change after first login!
d-i passwd/user-password password user
d-i passwd/user-password-again password user
d-i passwd/user-default-groups string audio cdrom dip floppy video plugdev netdev sudo

### Apt
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

### Package selection — no desktop, just base + ssh + tmux
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server tmux
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

### Bootloader — install GRUB on the default boot device
d-i grub-installer/only_new_os boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

### SSH key — install host's ~/.ssh/id_ed25519.pub as an authorized key for
### `user`, if the Makefile found one and served it as authorized_keys.
### Port must match PRESEED_PORT in Makefile.
d-i preseed/late_command string \
    in-target mkdir -p -m 700 /home/user/.ssh; \
    wget -q -O /target/home/user/.ssh/authorized_keys http://10.0.2.2:8765/authorized_keys; \
    if [ -s /target/home/user/.ssh/authorized_keys ]; then \
        in-target chown -R user:user /home/user/.ssh && \
        in-target chmod 700 /home/user/.ssh && \
        in-target chmod 600 /home/user/.ssh/authorized_keys; \
    else \
        rm -f /target/home/user/.ssh/authorized_keys; \
    fi; \
    wget -q -O /tmp/zeiss-ca.crt http://10.0.2.2:8765/ca.crt; \
    if [ -s /tmp/zeiss-ca.crt ]; then \
        cp /tmp/zeiss-ca.crt /target/usr/local/share/ca-certificates/zeiss-ca.crt && \
        in-target update-ca-certificates; \
    fi; \
    sed -i 's/[a-z0-9.-]*\.debian\.org/linux-mirror.zeiss.org\/linux/g' /target/etc/apt/sources.list.d/debian.sources; \
    sed -i 's#^URIs: http://#URIs: https://#g' /target/etc/apt/sources.list.d/debian.sources

### Finish — eject media and reboot
d-i cdrom-detect/eject boolean true
d-i finish-install/reboot_in_progress note
